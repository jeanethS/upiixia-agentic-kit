# Model-check the claims protocol (docs/tla) when the model or the code it models changes. Java lives only here:
# the engine and the kit payload do not need it.
name: tla
on:
  pull_request:
    paths: ["docs/tla/**", "kit/.uak/bin/lib/tx.sh", "kit/.uak/bin/lib/claim.sh", "scripts/tla_check.sh", ".github/workflows/tla.yml"]
  push:
    branches: [main]
    paths: ["docs/tla/**", "kit/.uak/bin/lib/tx.sh", "kit/.uak/bin/lib/claim.sh", "scripts/tla_check.sh", ".github/workflows/tla.yml"]
permissions:
  contents: read
jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uak-tla
          key: tla2tools-${{ hashFiles('scripts/tla_check.sh') }}
      - name: Model passes, broken variant fails
        env:
          UAK_TLA: "1"
        run: python3 kit/.uak/tests/test_tla_check.py
